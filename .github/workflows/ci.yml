name: SmartTraffic CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/smarttraffic-backend.log 2>&1 &
      - name: Start frontend preview
        working-directory: frontend
        run: nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/smarttraffic-frontend.log 2>&1 &
      - name: Wait for services
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health && break || sleep 1; done
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ && break || sleep 1; done
      - name: Run Playwright smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Show service logs on failure
        if: failure()
        run: |
          echo '--- backend ---'
          cat /tmp/smarttraffic-backend.log || true
          echo '--- frontend ---'
          cat /tmp/smarttraffic-frontend.log || true
