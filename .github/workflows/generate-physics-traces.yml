name: Generate SUMO demo traces

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/services/sumo_physics.py'
      - 'backend/app/services/single_junction.py'
      - 'simulation/physics/**'
      - 'scripts/generate_physics_traces.py'
      - '.github/workflows/generate-physics-traces.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools
          sumo --version
          netconvert --version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate portable traces
        run: python scripts/generate_physics_traces.py
      - name: Commit traces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/physics/traces simulation/physics/physics.net.xml
          if git diff --cached --quiet; then
            echo 'Traces already current.'
          else
            git commit -m 'chore: refresh bundled SUMO physics traces'
            git push
          fi
